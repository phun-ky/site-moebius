'section: workflows':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/workflows/**
'section: repo':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '*'
'section: tests':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '**/__tests__/**'
'experience: developer':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '.editorconfig'
              - '.gitignore'
              - '.githooks/**'
              - '.prettierrc'
              - '.eslintrc'
              - '.eslintignore'
              - '.browserslistrc'
              - 'tsconfig*.json'
              - 'scripts/**'
              - 'vite.config.ts'
'experience: visual':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.css'
              - 'public/**'
              - 'index.html'
'context: github':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - .github/**
'context: npm':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'package.json'
'mindless: ✏️ docs':
  - any:
      - head-branch: ['^docs', 'docs']
      - changed-files:
          - any-glob-to-any-file:
              - '**/*.md'
'mindless: 📦 dependencies':
  - any:
      - changed-files:
          - any-glob-to-any-file:
              - 'package-lock.json'

# Labels from the branch name: feat/..., fix/..., chore/..., improvements/...
'✨ feature':
  - head-branch: ['^feat', 'feat']
'problems: 🐛 bug':
  - head-branch: ['^fix', 'fix']
'mindless: 🤖 chore':
  - head-branch: ['^chore', 'chore']
'improvements: 💡 enhancement':
  - head-branch: ['^improvements', 'improvements']
