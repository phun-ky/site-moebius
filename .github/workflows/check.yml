name: Checks

on:
  push:
    branches: ['main']
  # No path filter: `check` is a required status check, so it has to report
  # on every PR or the PR cannot merge
  pull_request:
    branches: ['main']
    types: [opened, synchronize, reopened]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Read-only by default; jobs ask for what they need
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check what the build ships # No source maps in dist, JavaScript minified
        run: npm run check:dist
      - name: Type-check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check formatting
        run: npm run format:check
      - name: Test, with coverage # 80% of lines in utils, features, config and the SPA router and helpers
        run: npm run test:coverage
      - name: Check the layout # Headless Chrome (installed on the runner): no sideways scroll at any width
        run: npm run check:layout
      - name: Keep the layout screenshots # Every page at 390, 768 and 1440 px, dark and light
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots-${{ github.sha }}
          path: screenshots
          retention-days: 14
      - name: Check that nothing loads from other hosts
        run: npm run check:origins
      - name: Check the Content Security Policy
        run: npm run check:csp
      - name: Check accessibility with axe # WCAG 2.2 A and AA, every page, both themes, phone and desktop
        run: npm run check:a11y
      - name: Check keyboard use and reduced motion
        run: npm run check:keyboard
      - name: Check the performance budgets # Throttled phone: LCP, CLS, INP and bytes
        run: npm run check:performance
      - name: Check the routes # Served like GitHub Pages: every route 200, unknown paths 404
        run: npm run check:routes
      - name: Check the theme # Follows the system, saved choice wins, toggles once per click
        run: npm run check:theme
      - name: Validate the HTML # The built files and every page as rendered
        run: npm run check:html
      - name: Check the links # Pages, assets and anchors in the build, relative links in the Markdown
        run: npm run check:links
      - name: Check the metadata # Titles, descriptions, canonical URLs, social card, sitemap and robots.txt
        run: npm run check:metadata

  notify:
    name: Notify failed check
    needs: check
    # Only for main; a failing pull request already shows its failed check
    if: failure() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
