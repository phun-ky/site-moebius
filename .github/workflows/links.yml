# Links to other sites, from the built pages and the repo's Markdown, break
# without anything changing here, so they are checked weekly instead of on
# every pull request (#39). A failure opens an issue, or comments on the open
# one.

name: Links

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Read-only by default; jobs ask for what they need
permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js environment
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check every link, including other sites
        run: npm run check:links:external

  notify:
    name: Notify broken links
    needs: links
    if: failure()
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    steps:
      - uses: drivendataorg/failed-build-issue-action@940568ce50eeef3f31a920614cefcc6102d2f930 # v1.3.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          label-name: 'problems: 💔 build failed'
