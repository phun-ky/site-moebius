version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    # Major updates are not grouped, so each one gets its own PR to test and merge
    groups:
      minor-and-patch:
        applies-to: version-updates
        update-types:
          - 'minor'
          - 'patch'
    ignore:
      # Keep @types/node on the Node major used by CI (24)
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'
    schedule:
      interval: 'weekly'
    # Only versions at least two weeks old; security updates still come at once
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'chore: 🤖 '
    open-pull-requests-limit: 5

  # Actions are pinned to commit SHAs; this keeps the pins and their version
  # comments up to date
  - package-ecosystem: 'github-actions'
    directory: '/'
    groups:
      actions:
        patterns:
          - '*'
    schedule:
      interval: 'weekly'
    cooldown:
      default-days: 14
    labels:
      - 'mindless: 📦 dependencies'
    commit-message:
      prefix: 'ci: 🎡 '
